name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  KUJO_COMMIT: cc2d7dbb59a8dc05f00d629e100932f56f4062f6
jobs:
  kujo-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: ${{ env.KUJO_COMMIT }}
          path: .runtime/kujo
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - name: Build pinned Kujo runtime
        run: cargo build --release --locked --no-default-features --manifest-path .runtime/kujo/Cargo.toml
      - name: Validate
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/release/kujo
        run: bash scripts/validate.sh
      - name: Verify declared tree capacity
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/release/kujo
        run: '"$KUJO_BIN" run scripts/benchmark.kujo -- tree'
