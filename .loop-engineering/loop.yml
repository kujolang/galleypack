objective: "Clean up, verify, and prepare GalleyPack for the v0.2.0 release without weakening its authority boundaries."
checklist_file: ""
max_iterations: 1
max_no_progress: 1
max_consecutive_failures: 1

allowed_actions:
  - read_files
  - edit_files
  - run_tests
  - commit_local_changes
  - push_changes
  - tag_release
  - publish_release

blocked_actions:
  - deploy
  - destructive_cleanup
  - production_config_change
  - contract_major_change

eval_gates:
  - id: production_validation
    command: "bash scripts/validate.sh"
    required: true
  - id: diff_check
    command: "git diff --check -- src tests scripts schemas README.md docs"
    required: true

commit:
  enabled: true
  strategy: small_meaningful
  push: true

memory:
  enabled: false
  provider: strata
  project: "Agent Notes"
  mode: consolidate
  retrieval_tests: true
